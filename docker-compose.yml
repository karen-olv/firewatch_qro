name: firewatch_qro

networks:
  # Red PÚBLICA: servicios accesibles desde internet (solo vía HAProxy)
  public_net:
    driver: bridge
  # Red PRIVADA: servicios internos (API, BD, Redis, monitoreo) aislados
  private_net:
    driver: bridge

volumes:
  pg_data:
  grafana_data:
  prometheus_data:
  firewall_textfile:

services:
  # =============================================================
  #  RED PRIVADA 1/2: PostgreSQL + Redis
  # =============================================================
  db:
    image: postgres:16-alpine
    container_name: firewatch_db
    restart: always
    environment:
      POSTGRES_DB: firewatch_qro
      POSTGRES_USER: firewatch_user
      POSTGRES_PASSWORD: firewatch_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - private_net
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firewatch_user -d firewatch_qro"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: firewatch_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - private_net
    expose:
      - "6379"

  # =============================================================
  #  RED PRIVADA: Inicialización one-shot de la BD
  #  Crea tablas y siembra datos demo una sola vez (evita carreras).
  # =============================================================
  db-init:
    build: ./backend
    container_name: firewatch_db_init
    command: python init_db.py
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg2://firewatch_user:firewatch_pass@db:5432/firewatch_qro
      JWT_SECRET_KEY: cambia-esta-clave-jwt-por-otra-propia
      SECRET_KEY: clave-super-secreta-firewatch-2026
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - private_net

  # =============================================================
  #  RED PRIVADA 2/2: API balanceada (3 réplicas)
  #  Puertos privados: api1=8001, api2=8002, api3=8003
  # =============================================================
  api1:
    build: ./backend
    container_name: api1
    restart: always
    environment: &api_env
      DATABASE_URL: postgresql+psycopg2://firewatch_user:firewatch_pass@db:5432/firewatch_qro
      JWT_SECRET_KEY: cambia-esta-clave-jwt-por-otra-propia
      SECRET_KEY: clave-super-secreta-firewatch-2026
      REDIS_URL: redis://redis:6379/0
      FLASK_DEBUG: "0"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - private_net
    expose:
      - "5000"

  api2:
    build: ./backend
    container_name: api2
    restart: always
    environment:
      <<: *api_env
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - private_net
    expose:
      - "5000"

  api3:
    build: ./backend
    container_name: api3
    restart: always
    environment:
      <<: *api_env
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - private_net
    expose:
      - "5000"

  # =============================================================
  #  RED PRIVADA: Workers Flask (consumen cola de Redis)
  #  Puertos privados: flask1=5001, flask2=5002
  # =============================================================
  flask1:
    build: ./backend
    container_name: flask1
    command: python worker.py
    restart: always
    environment:
      <<: *api_env
      FLASK_PORT: "5001"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - private_net
    expose:
      - "5001"

  flask2:
    build: ./backend
    container_name: flask2
    command: python worker.py
    restart: always
    environment:
      <<: *api_env
      FLASK_PORT: "5002"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - private_net
    expose:
      - "5002"

  # =============================================================
  #  RED PRIVADA: Monitoreo (Prometheus + exporters)
  # =============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: firewatch_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - private_net
    ports:
      - "9090:9090"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: firewatch_postgres_exporter
    restart: always
    environment:
      - DATA_SOURCE_NAME=postgresql://firewatch_user:firewatch_pass@db:5432/firewatch_qro?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private_net
    expose:
      - "9187"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: firewatch_redis_exporter
    restart: always
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    networks:
      - private_net
    expose:
      - "9121"

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: firewatch_node_exporter
    restart: always
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      # Métricas de firewall generadas por firewall-exporter (textfile collector)
      - firewall_textfile:/var/lib/node_exporter/textfile:ro
    networks:
      - private_net
    expose:
      - "9100"

  # =============================================================
  #  RED PRIVADA: Firewall Exporter (monitoreo de firewall)
  #  Corre en el namespace de red del host para leer /proc/net y
  #  ejecutar ufw/iptables. Escribe métricas en un volumen
  #  compartido que node-exporter publica como "firewall_*".
  # =============================================================
  firewall-exporter:
    build: ./monitoring/firewall
    container_name: firewatch_firewall_exporter
    restart: always
    network_mode: host
    environment:
      - OUT_DIR=/var/lib/node_exporter/textfile
    volumes:
      - firewall_textfile:/var/lib/node_exporter/textfile

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: firewatch_cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - private_net
    expose:
      - "8080"
    privileged: true
    devices:
      - /dev/kmsg

  # =============================================================
  #  RED PÚBLICA: Frontend Web + Grafana + HAProxy
  # =============================================================
  frontend:
    build: ./frontend
    container_name: firewatch_frontend
    restart: always
    networks:
      - public_net
    expose:
      - "80"

  grafana:
    image: grafana/grafana:latest
    container_name: firewatch_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - public_net
      - private_net
    expose:
      - "3000"

  haproxy:
    image: haproxy:2.9-alpine
    container_name: firewatch_haproxy
    restart: always
    depends_on:
      - api1
      - api2
      - api3
      - frontend
      - grafana
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "8404:8404"
      - "8405:8405"
    volumes:
      - ./deploy/haproxy:/usr/local/etc/haproxy:ro
      # Certificados SSL en /etc/haproxy/certs (capa independiente para no
      # interferir con el volumen ro de la configuración)
      - ./deploy/ssl/certs:/etc/haproxy/certs:ro
    networks:
      - public_net
      - private_net

