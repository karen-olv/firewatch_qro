name: firewatch_monitoring

# Stack OPCIONAL e independiente de monitoreo.
# NOTA: El docker-compose.yml raíz YA incluye Prometheus + exporters.
# Este archivo se deja como referencia/complemento para quien quiera
# levantar monitoreo por separado conectándose a la red privada del stack
# principal (creada automáticamente como firewatch_qro_private_net).

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: firewatch_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - firewatch_private
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: firewatch_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - firewatch_private

volumes:
  grafana_data:

networks:
  # Se conecta a la red privada del stack principal (si existe).
  firewatch_private:
    name: firewatch_qro_private_net
    external: true

