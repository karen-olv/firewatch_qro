services:
  prometheus:
    image: prom/prometheus:latest
    container_name: firewatch_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: firewatch_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: firewatch_mysqld_exporter
    environment:
      # MySQL está expuesto en el host en el puerto 3307
      # (definido en el docker-compose.yml raíz del proyecto).
      - DATA_SOURCE_NAME=exporter:exporter_pass@(host.docker.internal:3307)/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9104:9104"
    restart: unless-stopped

volumes:
  grafana_data:

