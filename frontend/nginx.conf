server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: todas las rutas van al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy a la API Flask (HAProxy balancea api1-3 en :8080)
    # El frontend llama a /api/* y Nginx lo reenvía al HAProxy.
    # En este stack, HAProxy expone la API en :8080.
    #
    # Usamos el resolver interno de Docker (127.0.0.11) con una variable
    # para que Nginx NO falle al arrancar si HAProxy aún no está levantado.
    # La resolución del nombre "haproxy" ocurre en tiempo de ejecución.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_api http://haproxy:8080;
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache de estáticos
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

