# ============================================================
# FireWatch QRO - HAProxy (Balanceador de carga + SSL + Panel)
# ============================================================
global
    maxconn 50000
    log stdout format raw local0 info
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11
    tune.ssl.default-dh-param 2048

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s

# ------------------------------------------------------------
# Frontend: HTTP -> redirige a HTTPS
# ------------------------------------------------------------
frontend http_in
    bind *:80
    http-request redirect scheme https unless { ssl_fc }
    default_backend web_servers

# ------------------------------------------------------------
# Frontend: HTTPS (SSL)
# Sirve el Frontend Web en :443
# ------------------------------------------------------------
frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/firewatch.pem
    http-request set-header X-Forwarded-Proto https
    default_backend web_servers

# ------------------------------------------------------------
# API: en :8080 -> balancea entre api1, api2, api3
# ------------------------------------------------------------
frontend api_in
    bind *:8080
    use_backend api_servers

# ------------------------------------------------------------
# Stats / Monitoreo HAProxy en :8404
# ------------------------------------------------------------
frontend stats_in
    bind *:8404
    stats enable
    stats uri /
    stats refresh 10s
    stats admin if LOCALHOST
    stats auth admin:admin123
    stats show-node
    stats show-legends

# ------------------------------------------------------------
# Grafana expuesto en :8405
# ------------------------------------------------------------
frontend grafana_in
    bind *:8405
    default_backend grafana_servers

# ------------------------------------------------------------
# Backends
# ------------------------------------------------------------
backend web_servers
    balance roundrobin
    option httpchk GET /index.html
    server frontend1 frontend:80 check inter 5s fall 3 rise 2

backend api_servers
    balance roundrobin
    option httpchk GET /api/health
    http-request set-header X-Real-IP %[src]
    server api1 api1:5000 check inter 5s fall 3 rise 2
    server api2 api2:5000 check inter 5s fall 3 rise 2
    server api3 api3:5000 check inter 5s fall 3 rise 2

backend grafana_servers
    balance roundrobin
    option httpchk GET /login
    server grafana1 grafana:3000 check inter 5s fall 3 rise 2

